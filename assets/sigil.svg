<svg width="260" height="260" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#00fff2"/>
      <stop offset="100%" stop-color="#a200ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- outer rotating rune ring -->
  <g filter="url(#sglow)" fill="none" stroke="#a200ff" stroke-width="2" opacity="0.9">
    <circle cx="130" cy="130" r="110" stroke-dasharray="4 10"/>
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 130 130" to="360 130 130" dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- middle ring, counter-rotating -->
  <g filter="url(#sglow)" fill="none" stroke="#00d0ff" stroke-width="2.5" opacity="0.85">
    <circle cx="130" cy="130" r="85" stroke-dasharray="2 14"/>
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="360 130 130" to="0 130 130" dur="9s" repeatCount="indefinite"/>
  </g>

  <!-- triangle glyph rotating -->
  <g filter="url(#sglow)" fill="none" stroke="#ff00e5" stroke-width="2">
    <polygon points="130,55 190,175 70,175"/>
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 130 130" to="-360 130 130" dur="18s" repeatCount="indefinite"/>
  </g>

  <!-- pulsing core -->
  <circle cx="130" cy="130" r="34" fill="url(#core)">
    <animate attributeName="r" values="30;40;30" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- orbiting sparks -->
  <g fill="#fff700">
    <circle cx="130" cy="20" r="4">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 130 130" to="360 130 130" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#00fff2">
    <circle cx="130" cy="240" r="3.5">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="360 130 130" to="0 130 130" dur="7.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
