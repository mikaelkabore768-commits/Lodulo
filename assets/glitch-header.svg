<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050014"/>
      <stop offset="100%" stop-color="#0a0025"/>
    </linearGradient>
  </defs>

  <rect width="900" height="180" fill="url(#bg)" rx="14"/>

  <!-- scanline sweep -->
  <rect x="0" y="0" width="900" height="18" fill="#ffffff" opacity="0.05">
    <animate attributeName="y" values="0;170;0" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- flicker overlay -->
  <rect width="900" height="180" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.06;0;0;0;0.02;0" dur="1.7s" repeatCount="indefinite"/>
  </rect>

  <g filter="url(#glow)" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="58" text-anchor="middle">
    <!-- cyan layer -->
    <text x="450" y="88" fill="#00fff2">
      VDZ ZONE
      <animateTransform attributeName="transform" type="translate" values="-3,0; 2,0; -1,0; 3,0; -3,0" dur="0.35s" repeatCount="indefinite"/>
    </text>
    <!-- magenta layer -->
    <text x="450" y="88" fill="#ff00e5" opacity="0.85">
      VDZ ZONE
      <animateTransform attributeName="transform" type="translate" values="3,0; -2,0; 1,0; -3,0; 3,0" dur="0.35s" repeatCount="indefinite"/>
    </text>
    <!-- base white -->
    <text x="450" y="88" fill="#ffffff">
      VDZ ZONE
    </text>
  </g>

  <g font-family="'JetBrains Mono', monospace" font-weight="500" font-size="20" text-anchor="middle" fill="#b76bff">
    <text x="450" y="130">✨ SLIME TECH EMPIRE ✨</text>
  </g>

  <!-- glitch bars -->
  <rect x="120" y="60" width="90" height="6" fill="#00fff2" opacity="0.7">
    <animate attributeName="x" values="120;700;40;500;120" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7;0;0.7" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="600" y="110" width="130" height="4" fill="#ff00e5" opacity="0.6">
    <animate attributeName="x" values="600;100;450;800;600" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6;0;0.6" dur="1.3s" repeatCount="indefinite"/>
  </rect>
</svg>
