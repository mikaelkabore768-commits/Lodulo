<svg width="1000" height="30" viewBox="0 0 1000 30" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff004c">
        <animate attributeName="stop-color" values="#ff004c;#ff9900;#fff700;#00ff85;#00d0ff;#a200ff;#ff004c" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00d0ff">
        <animate attributeName="stop-color" values="#00d0ff;#a200ff;#ff004c;#ff9900;#fff700;#00ff85;#00d0ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a200ff">
        <animate attributeName="stop-color" values="#a200ff;#ff004c;#ff9900;#fff700;#00ff85;#00d0ff;#a200ff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="12" width="1000" height="6" rx="3" fill="url(#neonGrad)" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="2.2s" repeatCount="indefinite"/>
  </rect>
</svg>
